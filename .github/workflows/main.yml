name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory and build
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Found project in: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install --legacy-peer-deps
          npx vite build --base=./
          mkdir -p $GITHUB_WORKSPACE/dist_output
          cp -r dist/* $GITHUB_WORKSPACE/dist_output/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
