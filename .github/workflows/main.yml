name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Root
        id: locate
        run: |
          echo "=== Locating Project Root ==="
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json could not be found!"
            exit 1
          fi
          TARGET_DIR=$(dirname "$PKG_PATH")
          echo "Project directory: $TARGET_DIR"
          echo "workdir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ${{ steps.locate.outputs.workdir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Project
        working-directory: ${{ steps.locate.outputs.workdir }}
        run: npm run build

      - name: Setup GitHub Pages (Auto-Enable if not configured)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ steps.locate.outputs.workdir }}/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
